name: Update Lemonade

on:
  schedule:
    # Run daily at 4:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      update_available: ${{ steps.check.outputs.update_available }}
      current_version: ${{ steps.check.outputs.current_version }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      changelog: ${{ steps.check.outputs.changelog }}
      migration_flagged: ${{ steps.migration.outputs.flagged }}
      migration_note: ${{ steps.migration.outputs.note }}
      breaking_flagged: ${{ steps.breaking.outputs.flagged }}
      breaking_note: ${{ steps.breaking.outputs.note }}
      scheme_flagged: ${{ steps.scheme.outputs.flagged }}
      scheme_note: ${{ steps.scheme.outputs.note }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for updates
        id: check
        # The update script reads GITHUB_TOKEN so its api.github.com calls are
        # authenticated (1,000 req/h per repo) rather than sharing the anonymous
        # 60 req/h budget of this runner's egress IP — see scripts/upstream-lib.sh.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lemonade
          if ! result=$(APP_PATH=. CHECK_ONLY=true JSON_OUTPUT=true bash ../.github/scripts/update-lemonade.sh); then
            # The script has already put the upstream response on stderr (see the log above).
            echo "::error::Update check failed: $(echo "$result" | jq -r '.error // "no result"' 2>/dev/null)"
            exit 1
          fi
          echo "Result: $result"

          update_available=$(echo "$result" | jq -r '.update_available')
          current=$(echo "$result" | jq -r '.current')
          latest=$(echo "$result" | jq -r '.latest')
          changelog=$(echo "$result" | jq -r '.changelog')

          echo "update_available=$update_available" >> $GITHUB_OUTPUT
          echo "current_version=$current" >> $GITHUB_OUTPUT
          echo "latest_version=$latest" >> $GITHUB_OUTPUT
          # Unclamped copy for the breaking-changes check below.
          printf '%s\n' "$changelog" > "${RUNNER_TEMP}/release-notes.md"
          # CHANGELOG.md gets the release notes in full — the update script
          # writes that file itself and no longer truncates. This copy feeds the
          # PR body, which GitHub hard-caps at 65,536 characters; exceeding it
          # fails PR creation outright. So clamp only that, only when it would
          # actually overflow, on a line boundary, and say so with a link rather
          # than stopping mid-sentence the way the old 1000-byte cut did.
          if [ "$(printf '%s' "$changelog" | wc -c)" -gt 60000 ]; then
            changelog="$(printf '%s\n' "$changelog" \
              | awk 'BEGIN { n = 0 } { n += length($0) + 1; if (n > 60000) exit; print }')

          _Truncated to fit GitHub's PR body limit — the full notes are in this PR's CHANGELOG.md diff._"
          fi

          # A delimiter the release notes cannot contain. Upstream text is
          # arbitrary now that it is not capped, and a literal EOF line in it
          # would break this heredoc and fail the step.
          delim="CHANGELOG_EOF_$(date +%s%N)_$RANDOM"
          {
            echo "changelog<<${delim}"
            echo "$changelog"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # The smoke test only sees a fresh container, so a data-layout change
      # that bites devices with existing state can pass CI (how 11.8.0's
      # config-dir move would have shipped if the config assertion hadn't
      # happened to catch it). Upstream documents such changes on the wiki's
      # Migration page — the script flags when the page documents a migration
      # anywhere in the range (current, target], not just at the target: a PR
      # that skips releases (e.g. 11.7.0 -> 11.8.2 while the pipeline was
      # down) still crosses the 11.8.0 boundary. Fetch failure also blocks:
      # the unattended path only proceeds on a positively clean check.
      - name: Check upstream migration page
        id: migration
        if: steps.check.outputs.update_available == 'true'
        run: |
          current="${{ steps.check.outputs.current_version }}"
          latest="${{ steps.check.outputs.latest_version }}"
          url="https://github.com/lemonade-sdk/lemonade/wiki/Migration"

          set +e
          hits="$(bash .github/scripts/check-lemonade-migration.sh "${current}" "${latest}")"
          rc=$?
          set -e

          case "${rc}" in
            0)
              echo "flagged=false" >> "$GITHUB_OUTPUT"
              echo "note=The [migration page](${url}) documents no migration crossed by ${current} → ${latest}. (It has under-reported container impact before — the smoke test remains the backstop.)" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "flagged=true" >> "$GITHUB_OUTPUT"
              echo "note=⚠️ **The [migration page](${url}) documents migration steps crossed by ${current} → ${latest}** (matched: ${hits}). Auto-merge is blocked with \`needs-review\`. The page describes the systemd packaging, not this container; translate it per lemonade/CLAUDE.md \"Version Updates\" before merging." >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "flagged=true" >> "$GITHUB_OUTPUT"
              echo "note=⚠️ The [migration page](${url}) could not be fetched, so the ${current} → ${latest} upgrade was NOT checked for migration steps. Auto-merge is blocked with \`needs-review\`; check the page manually before merging." >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The Migration page only carries what upstream chooses to write up —
      # 11.9.0 deprecated LEMONADE_ALLOWED_ORIGINS, which this app set on every
      # boot, with nothing there, and the PR auto-merged. This reads the
      # release's own "Breaking Changes" section and flags the identifiers in
      # it that the app's CODE uses (config keys, env vars, paths, flags).
      # Docs are not searched: they mention far more than the app relies on.
      # Upstream lists breaking changes on every release and about five bumps
      # in six name something here, so this asks for a glance often; each hit
      # carries the files and upstream's sentence to keep the glance short.
      - name: Check release notes for breaking changes this app depends on
        id: breaking
        if: steps.check.outputs.update_available == 'true'
        run: |
          latest="${{ steps.check.outputs.latest_version }}"

          set +e
          hits="$(bash .github/scripts/check-lemonade-breaking.sh "${RUNNER_TEMP}/release-notes.md" \
              lemonade/config.yaml lemonade/build.yaml lemonade/Dockerfile lemonade/apparmor.txt \
              lemonade/rootfs lemonade/ha-lemonade-bridge \
              .github/scripts/smoke-test.sh .github/scripts/mock-supervisor.py)"
          rc=$?
          set -e

          case "${rc}" in
            0)
              echo "flagged=false" >> "$GITHUB_OUTPUT"
              echo "note=The release's Breaking Changes section names nothing this app's code uses." >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "flagged=true" >> "$GITHUB_OUTPUT"
              delim="BREAKING_EOF_$(date +%s%N)_$RANDOM"
              {
                echo "note<<${delim}"
                echo "⚠️ **The release's Breaking Changes section names things this app's code uses.** Auto-merge is blocked with \`needs-review\`. Each line: the identifier, where the app uses it, and upstream's sentence."
                echo
                echo '```'
                echo "${hits}"
                echo '```'
                echo "${delim}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "flagged=true" >> "$GITHUB_OUTPUT"
              echo "note=⚠️ The release notes could not be read, so ${latest} was NOT checked for breaking changes. Auto-merge is blocked with \`needs-review\`; read them manually before merging." >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Upstream replaced X.Y.Z with YYYY.WW.N (ISO year.week.build) after
      # 11.9.0, so the next stable bump reads 11.9.0 -> 2026.NN.N. The two gates
      # above happen to catch that release — its notes name `--version`, which
      # the Dockerfile uses — but a gate that depends on upstream's wording is
      # not a gate. Flag any jump of more than one in the leading component:
      # a numbering change or a skipped major, either of which deserves a
      # human reading the whole range rather than one release's notes.
      # Steady-state calver (2026.39 -> 2026.40, 2026.52 -> 2027.1) never fires.
      - name: Check for a version-scheme change
        id: scheme
        if: steps.check.outputs.update_available == 'true'
        run: |
          current="${{ steps.check.outputs.current_version }}"
          latest="${{ steps.check.outputs.latest_version }}"
          cur_major="${current%%.*}"
          new_major="${latest%%.*}"

          if ! [[ "${cur_major}" =~ ^[0-9]+$ && "${new_major}" =~ ^[0-9]+$ ]]; then
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            echo "note=⚠️ Could not compare the leading version components of ${current} and ${latest}. Auto-merge is blocked with \`needs-review\`; check the numbering by hand." >> "$GITHUB_OUTPUT"
          elif [ "$((10#${new_major} - 10#${cur_major}))" -gt 1 ]; then
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            delim="SCHEME_EOF_$(date +%s%N)_$RANDOM"
            {
              echo "note<<${delim}"
              echo "⚠️ **The leading version component jumped ${cur_major} → ${new_major}** — upstream changed its numbering scheme (Lemonade moved from \`X.Y.Z\` to \`YYYY.WW.N\` after 11.9.0) or skipped a major. Auto-merge is blocked with \`needs-review\`. Before merging:"
              echo
              echo "1. Read the release notes for the whole range, not just this release's Breaking Changes."
              echo "2. Confirm Home Assistant orders \`${latest}\` above \`${current}\` (AwesomeVersion; \`11.9.0 < 2026.39.1\` was verified on 2026-09-20)."
              echo "3. Confirm the Dockerfile's download URL, ghcr tag and asset names still match upstream's layout — the packaging check above covers the archives and the image tag for this release."
              echo "4. Update lemonade/CLAUDE.md \"Lemonade Version Scheme\" if the scheme changed."
              echo "${delim}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "flagged=false" >> "$GITHUB_OUTPUT"
            echo "note=The leading version component moved ${cur_major} → ${new_major}; no numbering-scheme change." >> "$GITHUB_OUTPUT"
          fi

  update-version:
    needs: check-update
    if: needs.check-update.outputs.update_available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Lemonade
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lemonade
          APP_PATH=. CHECK_ONLY=false JSON_OUTPUT=false bash ../.github/scripts/update-lemonade.sh

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: |
            Update Lemonade to ${{ needs.check-update.outputs.latest_version }}

            Automated update from ${{ needs.check-update.outputs.current_version }} to ${{ needs.check-update.outputs.latest_version }}
          branch: update-lemonade-${{ needs.check-update.outputs.latest_version }}
          delete-branch: true
          title: "Update Lemonade to ${{ needs.check-update.outputs.latest_version }}"
          body: |
            ## Lemonade LLM Server Update

            This automated PR updates Lemonade from `${{ needs.check-update.outputs.current_version }}` to `${{ needs.check-update.outputs.latest_version }}`.

            ### Changelog

            ${{ needs.check-update.outputs.changelog }}

            ### Changes

            - Updated `config.yaml` version
            - Updated `build.yaml` LEMONADE_VERSION
            - Updated `Dockerfile` LEMONADE_VERSION
            - Updated documentation files
            - Updated CHANGELOG.md

            ### Packaging check

            The update script verified this release ships both
            `lemonade-embeddable-<version>-ubuntu-arm64.tar.gz` and
            `...-x64.tar.gz`, which are the archives this app installs.

            The image bundles a glibc closure computed with `ldd` at build time.
            If this release adds a new shared-library dependency, the smoke test
            will surface it as `error while loading shared libraries`.

            ### Migration check

            ${{ needs.check-update.outputs.migration_note }}

            ### Breaking changes check

            ${{ needs.check-update.outputs.breaking_note }}

            ### Version scheme check

            ${{ needs.check-update.outputs.scheme_note }}

            ### Release Notes

            Full release notes: https://github.com/lemonade-sdk/lemonade/releases/tag/v${{ needs.check-update.outputs.latest_version }}

            ---

            This PR was automatically generated by the Update Lemonade workflow
          labels: |
            automated
            lemonade
            update
          draft: false

      # Must run BEFORE the downstream dispatch: pr-validate's auto-merge gate
      # reads labels when it starts, and needs-review is one of its blocking
      # labels. The REST endpoint auto-creates the label if it doesn't exist.
      - name: Block auto-merge (upstream flagged this version)
        if: steps.create-pr.outputs.pull-request-number && (needs.check-update.outputs.migration_flagged == 'true' || needs.check-update.outputs.breaking_flagged == 'true' || needs.check-update.outputs.scheme_flagged == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "repos/${{ github.repository }}/issues/${{ steps.create-pr.outputs.pull-request-number }}/labels" \
            -f "labels[]=needs-review"

      # needs-review blocks the merge but notifies no one (Lemonade 2026.39.1
      # sat three days in #38). A review request does. Once, on creation; non-fatal.
      - name: Ask the owner to review
        if: steps.create-pr.outputs.pull-request-operation == 'created' && (needs.check-update.outputs.migration_flagged == 'true' || needs.check-update.outputs.breaking_flagged == 'true' || needs.check-update.outputs.scheme_flagged == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/pulls/${{ steps.create-pr.outputs.pull-request-number }}/requested_reviewers" \
            -f "reviewers[]=${{ github.repository_owner }}" > /dev/null \
            || echo "::warning::Could not request a review from ${{ github.repository_owner }}; the PR is still parked by needs-review."

      - name: Trigger downstream workflows
        if: steps.create-pr.outputs.pull-request-number
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "automated-pr-created",
              "client_payload": {
                "pull_request_number": "${{ steps.create-pr.outputs.pull-request-number }}",
                "head_sha": "${{ steps.create-pr.outputs.pull-request-head-sha }}",
                "branch": "update-lemonade-${{ needs.check-update.outputs.latest_version }}",
                "app": "lemonade"
              }
            }'
