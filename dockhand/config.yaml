name: "Dockhand"
description: "Modern Docker management UI with real-time container orchestration and Compose stack management"
version: "1.0.58.2"
slug: "dockhand"
init: false
ingress: true
# ha-ingress-adapter, not Dockhand itself: Dockhand expects the site root.
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:docker
panel_title: Dockhand
arch:
  - aarch64
  - amd64
startup: services
boot: auto
watchdog: tcp://[HOST]:[PORT:3000]/api/health
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface"
host_network: false
apparmor: true
hassio_api: true
docker_api: true
hassio_role: admin
map:
  - ssl:ro
  - data:rw
  - media:rw
  - share:rw
options:
  log_level: info
  puid: 0
  pgid: 0
  hide_hassio_containers: true
  traefik_enable: false
  traefik_domain: ""
  traefik_entrypoints: "websecure"
  traefik_certresolver: "cloudflare"
schema:
  log_level: list(trace|debug|info|warning|error|fatal)?
  puid: int?
  pgid: int?
  hide_hassio_containers: bool?
  traefik_enable: bool?
  traefik_domain: str?
  traefik_entrypoints: str?
  traefik_certresolver: str?
