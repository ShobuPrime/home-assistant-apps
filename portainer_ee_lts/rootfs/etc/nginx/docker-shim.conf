# =============================================================================
# Docker socket shim
# =============================================================================
# dockerd removed support for a HostConfig body on POST /containers/{id}/start
# in API v1.24 and now hard-rejects any start request that *might* carry one:
#
#   400 Bad Request — "starting container with non-empty request body was
#   deprecated since API v1.22 and removed in v1.24"
#
# The check runs in the HTTP handler before any container-state logic, so the
# message says nothing about the container — it replaces whatever the real
# start failure was. Portainer's Docker-API proxy forwards the body and
# transfer encoding it received from the browser, and a request whose length is
# unknown (Transfer-Encoding: chunked, which is what Go reverse proxies emit,
# including Home Assistant's streaming ingress proxy) is always rejected.
#
# Portainer EE is a closed binary and HAOS's dockerd is not configurable, so
# the app is the only place this can be fixed: Portainer talks to this shim
# instead of the socket, and the shim drops the request body on the lifecycle
# verbs where one is never legal. Everything else passes through untouched.
#
# This is run standalone (`nginx -c`) rather than through /etc/nginx/nginx.conf
# on purpose. Alpine's stock config already defines $connection_upgrade (a
# second `map` for the same variable is a fatal duplicate) and caps request
# bodies at 1m, which would 413 image builds and large container creates.
# =============================================================================

# The Supervisor mounts the socket as root:docker 0660. Alpine's default
# `nginx` worker user gets EACCES on it and every request 502s, so the workers
# run as root — as Portainer itself already does in this app.
user root;

worker_processes 1;
daemon off;
pid /run/nginx-docker-shim.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/octet-stream;

    # No cap. Image builds and stack deploys POST bodies far larger than
    # nginx's 1m default, and a 413 here would surface as a Portainer bug.
    client_max_body_size 0;

    map $http_upgrade $docker_connection {
        default upgrade;
        ''      close;
    }

    upstream docker_real {
        server unix:/run/docker.sock;
    }

    server {
        # nginx chmods its unix listen sockets to 0666 unconditionally, so the
        # 0700 parent directory (created by cont-init, and by this service's
        # run script) is what keeps the Docker API root-only inside the
        # container the way the real socket's 0660 root:docker does.
        listen unix:/run/docker-shim/docker.sock;

        # Docker's long-lived streams (exec, attach, logs -f, events, stats,
        # image pulls) must not be buffered in either direction.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Container lifecycle verbs. None of them accepts a request body, so
        # dropping it loses nothing — and it is what stops dockerd rejecting
        # the request before it ever looks at the container.
        #
        # Deliberately NOT matched here:
        #   /exec/{id}/start — takes a real JSON body ({"Detach":…,"Tty":…})
        #   …/attach         — needs the upgrade handling below
        location ~ "^/(?:v[0-9.]+/)?containers/[^/]+/(?:start|stop|restart|kill|pause|unpause|wait)$" {
            proxy_pass http://docker_real;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Everything else, verbatim. proxy_pass carries no URI part, which is
        # what makes nginx forward the request URI exactly as it arrived — no
        # normalisation, no re-encoding.
        location / {
            proxy_pass http://docker_real;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $docker_connection;
        }
    }
}
